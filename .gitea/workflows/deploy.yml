name: Build and Deploy tosh.io
run-name: Deploy by ${{ gitea.actor }} - ${{ gitea.sha }}
on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository name
        run: |
          echo "IMAGE_NAME=$(basename ${{ gitea.repository }})" >> $GITHUB_ENV
          echo "REGISTRY_HOST=homelab:5000" >> $GITHUB_ENV
          echo "COMMIT_SHA=$(echo ${{ gitea.sha }} | cut -c1-7)" >> $GITHUB_ENV

      - name: Build image
        run: |
          cd $GITEA_WORKSPACE
          echo "🔨 Building image..."
          podman build \
            -t ${IMAGE_NAME}:latest \
            -t ${IMAGE_NAME}:${COMMIT_SHA} \
            .

      - name: Tag for registry
        run: |
          echo "🧩 Tagging images for registry..."
          podman tag ${IMAGE_NAME}:latest ${REGISTRY_HOST}/${IMAGE_NAME}:latest
          podman tag ${IMAGE_NAME}:${COMMIT_SHA} ${REGISTRY_HOST}/${IMAGE_NAME}:${COMMIT_SHA}

      - name: Push to registry
        run: |
          echo "📤 Pushing images..."
          podman push ${REGISTRY_HOST}/${IMAGE_NAME}:latest
          podman push ${REGISTRY_HOST}/${IMAGE_NAME}:${COMMIT_SHA}
          echo "✅ Done! Images pushed:"
          echo "   - ${REGISTRY_HOST}/${IMAGE_NAME}:latest"
          echo "   - ${REGISTRY_HOST}/${IMAGE_NAME}:${COMMIT_SHA}"

      - name: Restart service
        run: |
          echo "♻ Refreshing container..."
          cd $HOME/projects/homelab
          podman pull ${REGISTRY_HOST}/${IMAGE_NAME}:latest
          systemctl --user daemon-reload
          systemctl --user restart tosh_io.service
          echo "🚀 Service restarted!"